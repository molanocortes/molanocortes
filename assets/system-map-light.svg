<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 372" width="1000" height="372" fill="none" role="img" aria-label="Signal map of the TAKTO ONE system. Twelve AS5600 joint encoders behind two multiplexers, two BNO085 IMUs and one EMG channel feed a Teensy 4.1 over I2C. The Teensy streams over USB serial to a host bridge, which owns the motor bus through a U2D2 and drives two Dynamixel XC330 servos on tendon spools, whose tendons close the loop back onto the worn hand. The same host serves one WebSocket contract to three synchronised surfaces: a web console, an AR headset layer called LUMEN, and an Android companion app."><defs><marker id="mlight" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7z" fill="#b9b3a3"/></marker><marker id="malight" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L7 4L0 7z" fill="#d94e12"/></marker></defs><rect x="8" y="44" width="228" height="216" rx="4" fill="#efece4" stroke="#ddd8ca" stroke-width="1" stroke-dasharray="3 3"/><text x="16" y="60" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="9" letter-spacing="2.0" text-anchor="start" fill="#6e6b62">WORN</text><rect x="20" y="70" width="204" height="52" rx="3" fill="#f6f4ef" stroke="#b9b3a3" stroke-width="1.2"/><text x="122" y="92" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="11" letter-spacing="1.0" text-anchor="middle" fill="#191713">12 x AS5600</text><text x="122" y="108" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="9.5" letter-spacing="0.8" text-anchor="middle" fill="#6e6b62">joint encoders, 2 x TCA9548A</text><rect x="20" y="134" width="204" height="52" rx="3" fill="#f6f4ef" stroke="#b9b3a3" stroke-width="1.2"/><text x="122" y="156" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="11" letter-spacing="1.0" text-anchor="middle" fill="#191713">2 x BNO085</text><text x="122" y="172" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="9.5" letter-spacing="0.8" text-anchor="middle" fill="#6e6b62">hand + forearm, separate buses</text><rect x="20" y="198" width="204" height="44" rx="3" fill="#f6f4ef" stroke="#b9b3a3" stroke-width="1.2"/><text x="122" y="224" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="11" letter-spacing="1.0" text-anchor="middle" fill="#191713">1 x EMG channel</text><path d="M224 96H250M224 160H250M224 220H250" stroke="#b9b3a3" stroke-width="1.2"/><path d="M250 96V220" stroke="#b9b3a3" stroke-width="1.2"/><path d="M250 160H300" stroke="#b9b3a3" stroke-width="1.2" marker-end="url(#mlight)"/><text x="258" y="152" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="8.5" letter-spacing="1.1" text-anchor="start" fill="#6e6b62">I2C</text><rect x="306" y="126" width="150" height="68" rx="3" fill="#f6f4ef" stroke="#b9b3a3" stroke-width="1.2"/><text x="381" y="156" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="11" letter-spacing="1.0" text-anchor="middle" fill="#191713">Teensy 4.1</text><text x="381" y="172" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="9.5" letter-spacing="0.8" text-anchor="middle" fill="#6e6b62">acquisition, SD log</text><path d="M456 160H514" stroke="#b9b3a3" stroke-width="1.2" marker-end="url(#mlight)"/><text x="485" y="152" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="8.5" letter-spacing="1.1" text-anchor="middle" fill="#6e6b62">USB serial</text><rect x="520" y="126" width="180" height="68" rx="3" fill="#f6f4ef" stroke="#b9b3a3" stroke-width="1.2"/><text x="610" y="156" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="11" letter-spacing="1.0" text-anchor="middle" fill="#191713">host bridge</text><text x="610" y="172" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="9.5" letter-spacing="0.8" text-anchor="middle" fill="#6e6b62">control loop</text><path d="M610 126V70H754" stroke="#b9b3a3" stroke-width="1.2" marker-end="url(#mlight)"/><text x="620" y="62" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="8.5" letter-spacing="1.1" text-anchor="start" fill="#6e6b62">U2D2 &#183; Protocol 2.0</text><rect x="760" y="44" width="200" height="52" rx="3" fill="#f6f4ef" stroke="#d94e12" stroke-width="1.6"/><text x="860" y="66" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="11" letter-spacing="1.0" text-anchor="middle" fill="#d94e12">2 x XC330</text><text x="860" y="82" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="9.5" letter-spacing="0.8" text-anchor="middle" fill="#6e6b62">tendon spools</text><path d="M860 44V22H122V64" stroke="#d94e12" stroke-width="1.8" marker-end="url(#malight)"/><rect x="438" y="12" width="106" height="20" rx="3" fill="#f6f4ef"/><text x="491" y="26" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="9.5" letter-spacing="1.8" text-anchor="middle" fill="#d94e12">TENDON</text><path d="M700 176H736V300" stroke="#b9b3a3" stroke-width="1.2"/><path d="M736 164H754" stroke="#b9b3a3" stroke-width="1.2" marker-end="url(#mlight)"/><path d="M736 226H754" stroke="#b9b3a3" stroke-width="1.2" marker-end="url(#mlight)"/><path d="M736 288H754" stroke="#b9b3a3" stroke-width="1.2" marker-end="url(#mlight)"/><path d="M736 176V300" stroke="#b9b3a3" stroke-width="1.2"/><rect x="760" y="140" width="200" height="48" rx="3" fill="#f6f4ef" stroke="#b9b3a3" stroke-width="1.2"/><text x="860" y="160" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="11" letter-spacing="1.0" text-anchor="middle" fill="#191713">web console</text><text x="860" y="176" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="9.5" letter-spacing="0.8" text-anchor="middle" fill="#6e6b62">:8096</text><rect x="760" y="202" width="200" height="48" rx="3" fill="#f6f4ef" stroke="#b9b3a3" stroke-width="1.2"/><text x="860" y="222" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="11" letter-spacing="1.0" text-anchor="middle" fill="#191713">AR headset</text><text x="860" y="238" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="9.5" letter-spacing="0.8" text-anchor="middle" fill="#6e6b62">LUMEN &#183; :8097</text><rect x="760" y="264" width="200" height="48" rx="3" fill="#f6f4ef" stroke="#b9b3a3" stroke-width="1.2"/><text x="860" y="284" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="11" letter-spacing="1.0" text-anchor="middle" fill="#191713">Android app</text><text x="860" y="300" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="9.5" letter-spacing="0.8" text-anchor="middle" fill="#6e6b62">companion, pairs by QR</text><text x="610" y="212" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="8.5" letter-spacing="0.9" text-anchor="middle" fill="#6e6b62">ws :8765</text><text x="8" y="296" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="9.5" letter-spacing="1.3" text-anchor="start" fill="#6e6b62">THE HOST OWNS THE MOTOR BUS</text><text x="8" y="314" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="9.5" letter-spacing="1.3" text-anchor="start" fill="#6e6b62">THE TEENSY ONLY SENSES</text><text x="8" y="350" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="9.5" letter-spacing="1.3" text-anchor="start" fill="#ddd8ca">ONE HOST &#183; THREE SYNCHRONISED SURFACES &#183; ONE CONTRACT</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 316" width="1000" height="316" fill="none" role="img" aria-label="Signal map of the TAKTO system. Twelve AS5600 joint encoders behind two multiplexers, two BNO085 IMUs and one EMG channel feed a Teensy 4.1, which streams over USB serial to a host PC. The host owns the motor bus through a U2D2 and drives Dynamixel XC330 servos on tendon spools, whose tendons close the loop back onto the worn hand. The host also feeds the web console, the AR layer and the Android app."><defs><marker id="mdark" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7z" fill="#544d43"/></marker><marker id="madark" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L7 4L0 7z" fill="#ff7a3d"/></marker></defs><rect x="8" y="44" width="228" height="216" rx="4" fill="#161310" stroke="#38332c" stroke-width="1" stroke-dasharray="3 3"/><text x="16" y="60" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="9" letter-spacing="2.0" text-anchor="start" fill="#8f887c">WORN</text><rect x="20" y="70" width="204" height="52" rx="3" fill="#1a1714" stroke="#544d43" stroke-width="1.2"/><text x="122" y="92" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="11" letter-spacing="1.0" text-anchor="middle" fill="#f0ede6">12 x AS5600</text><text x="122" y="108" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="9.5" letter-spacing="0.8" text-anchor="middle" fill="#8f887c">joint encoders, 2 x TCA9548A</text><rect x="20" y="134" width="204" height="52" rx="3" fill="#1a1714" stroke="#544d43" stroke-width="1.2"/><text x="122" y="156" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="11" letter-spacing="1.0" text-anchor="middle" fill="#f0ede6">2 x BNO085</text><text x="122" y="172" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="9.5" letter-spacing="0.8" text-anchor="middle" fill="#8f887c">hand + forearm, separate buses</text><rect x="20" y="198" width="204" height="44" rx="3" fill="#1a1714" stroke="#544d43" stroke-width="1.2"/><text x="122" y="224" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="11" letter-spacing="1.0" text-anchor="middle" fill="#f0ede6">1 x EMG channel</text><path d="M224 96H250M224 160H250M224 220H250" stroke="#544d43" stroke-width="1.2"/><path d="M250 96V220" stroke="#544d43" stroke-width="1.2"/><path d="M250 158H300" stroke="#544d43" stroke-width="1.2" marker-end="url(#mdark)"/><text x="258" y="150" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="8.5" letter-spacing="1.1" text-anchor="start" fill="#8f887c">I2C</text><rect x="306" y="126" width="164" height="68" rx="3" fill="#1a1714" stroke="#544d43" stroke-width="1.2"/><text x="388" y="156" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="11" letter-spacing="1.0" text-anchor="middle" fill="#f0ede6">Teensy 4.1</text><text x="388" y="172" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="9.5" letter-spacing="0.8" text-anchor="middle" fill="#8f887c">acquisition, SD log</text><path d="M470 160H540" stroke="#544d43" stroke-width="1.2" marker-end="url(#mdark)"/><text x="505" y="152" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="8.5" letter-spacing="1.1" text-anchor="middle" fill="#8f887c">USB serial</text><rect x="546" y="126" width="164" height="68" rx="3" fill="#1a1714" stroke="#544d43" stroke-width="1.2"/><text x="628" y="156" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="11" letter-spacing="1.0" text-anchor="middle" fill="#f0ede6">host PC</text><text x="628" y="172" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="9.5" letter-spacing="0.8" text-anchor="middle" fill="#8f887c">control loop</text><path d="M710 146H752V96H786" stroke="#544d43" stroke-width="1.2" marker-end="url(#mdark)"/><text x="746" y="100" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="8.5" letter-spacing="1.1" text-anchor="end" fill="#8f887c">U2D2 &#183; Protocol 2.0</text><path d="M710 174H752V222H786" stroke="#544d43" stroke-width="1.2" marker-end="url(#mdark)"/><rect x="792" y="70" width="192" height="52" rx="3" fill="#1a1714" stroke="#ff7a3d" stroke-width="1.6"/><text x="888" y="92" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="11" letter-spacing="1.0" text-anchor="middle" fill="#ff7a3d">2 x XC330</text><text x="888" y="108" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="9.5" letter-spacing="0.8" text-anchor="middle" fill="#8f887c">tendon spools</text><rect x="792" y="190" width="192" height="64" rx="3" fill="#1a1714" stroke="#544d43" stroke-width="1.2"/><text x="888" y="218" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="11" letter-spacing="1.0" text-anchor="middle" fill="#f0ede6">web console</text><text x="888" y="234" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="9.5" letter-spacing="0.8" text-anchor="middle" fill="#8f887c">AR layer &#183; Android</text><path d="M888 70V26H122V64" stroke="#ff7a3d" stroke-width="1.8" marker-end="url(#madark)"/><rect x="452" y="16" width="106" height="20" rx="3" fill="#1a1714"/><text x="505" y="30" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="9.5" letter-spacing="1.8" text-anchor="middle" fill="#ff7a3d">TENDON</text><text x="8" y="300" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="9.5" letter-spacing="1.3" text-anchor="start" fill="#8f887c">THE HOST OWNS THE MOTOR BUS &#183; THE TEENSY ONLY SENSES</text></svg>
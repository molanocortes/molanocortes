<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="236" viewBox="0 0 1000 236" role="img" aria-labelledby="t d">
<title id="t">What I build: mechanism, electronics, firmware, control and software, one data path</title>
<desc id="d">Five columns, one per layer of the TAKTO ONE stack, each with the specifics of the shipped design. A hairline along the bottom traces the data path from a finger joint to the 3D twin.</desc>
<text x="28" y="22" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="11" letter-spacing="2" fill="#8B8474">ONE ENGINEER, THE WHOLE STACK</text>
<text x="972" y="22" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="11" letter-spacing="2" text-anchor="end" fill="#8B8474">TAKTO ONE · 2026</text>

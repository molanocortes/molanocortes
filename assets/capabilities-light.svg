<title id="t">What I build: mechanism, electronics, firmware, control, software and machine learning, one data path</title>
<desc id="d">Six layers I work across, each opening with a TAKTO ONE fact and widening to work from elsewhere. A hairline traces the data path from a finger joint to a trained model.</desc>
